<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    TOVEDROP Favicon — Approach 1: "The Discovered T"
    =====================================================
    A pure water-drop silhouette where the T lives as negative space,
    discovered rather than stamped.

    GEOMETRY:
    - Golden ratio drop: width 300px (radius 150), height 1.618×300 = 485px
    - Circle centre: (256, 175). Dome top: y=25. Tip: y=510 (trimmed to 498)
    - Drop path: starts from top of dome, sweeps clockwise right, 
      then Bezier curves taper to the pointed tip, back up left side.
    - Pointed tip achieved via non-collinear control points (cusp).

    T CUTOUT (negative space via fill-rule=evenodd):
    - Golden ratio from tip: 0.618 × 473 = 292px from y=498 → bar centre y=206
    - Bar: 75px tall → y=168–243. Width=220px → x=146–366.
    - Stem: 80px wide → x=216–296. Height → y=243–440.
    - Bar deliberately narrower than the drop width at that height 
      so purple shows on both sides → reads as drop first, T second.
  -->
  <path
    fill="#8B5CF6"
    fill-rule="evenodd"
    d="
      M 256 25
      A 150 150 0 0 1 406 175
      C 446 310 302 488 256 498
      C 210 488 66 310 106 175
      A 150 150 0 0 1 256 25
      Z
      M 146 168 L 366 168 L 366 243
      L 296 243 L 296 440
      L 216 440 L 216 243
      L 146 243 Z
    "
  />
</svg>
